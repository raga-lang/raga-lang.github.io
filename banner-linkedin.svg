<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" role="img" aria-label="Raga: one pattern, every declaration">
<style>
  text { font-family: "JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; white-space: pre; }
  .h { font-size: 66px; font-weight: 700; fill: #e6edf3; }
  .hm { font-size: 66px; font-weight: 700; fill: #6e7681; }
  .code { font-size: 30px; fill: #e6edf3; }
  .kw { fill: #c792ea; font-weight: 700; }
  .fn { fill: #82aaff; font-weight: 700; }
  .ty { fill: #7fdbca; }
  .num { fill: #f78c6c; }
  .nm { fill: #ffcb6b; }
  .op { fill: #8b949e; }
  .cm { font-size: 24px; fill: #6e7681; }
  .ui { font-size: 18px; fill: #8b949e; }
</style>
<rect width="1200" height="627" fill="#0d1117"/>

<!-- window bar -->
<rect width="1200" height="48" fill="#161b22"/><rect y="48" width="1200" height="1" fill="#21262d"/>
<circle cx="30" cy="24" r="6" fill="#ff5f57"/><circle cx="52" cy="24" r="6" fill="#febc2e"/><circle cx="74" cy="24" r="6" fill="#28c840"/>
<rect x="130" y="10" width="190" height="38" fill="#0d1117"/><rect x="130" y="10" width="190" height="2" fill="#8b949e"/>
<text x="150" y="35" class="ui" style="fill:#e6edf3">pattern.raga</text>

<!-- headline -->
<text x="90" y="140" class="h">one pattern.</text>
<text x="90" y="216" class="hm">every declaration.</text>

<!-- shared parts: the const column and the = column -->
<rect x="84" y="276" width="96" height="226" rx="4" fill="#c792ea" fill-opacity="0.12"/>
<rect x="294" y="276" width="30" height="226" rx="4" fill="#c792ea" fill-opacity="0.12"/>

<!-- code -->
<text x="90" y="312" class="code"><tspan class="kw">const</tspan> <tspan class="nm">limit</tspan> <tspan class="op">=</tspan> <tspan class="num">100</tspan></text>
<text x="90" y="368" class="code"><tspan class="kw">const</tspan> <tspan class="nm">area </tspan> <tspan class="op">=</tspan> <tspan class="fn">function</tspan><tspan class="op">(</tspan><tspan class="ty">f64</tspan> r<tspan class="op">)</tspan> <tspan class="ty">f64</tspan> <tspan class="op">{</tspan> <tspan class="kw">return</tspan> r <tspan class="op">}</tspan></text>
<text x="90" y="424" class="code"><tspan class="kw">const</tspan> <tspan class="nm">Point</tspan> <tspan class="op">=</tspan> <tspan class="fn">class</tspan> <tspan class="op">{</tspan> <tspan class="ty">i32</tspan> x <tspan class="op">=</tspan> <tspan class="num">0</tspan> <tspan class="op">}</tspan></text>
<text x="90" y="480" class="code"><tspan class="kw">const</tspan> <tspan class="nm">route</tspan> <tspan class="op">=</tspan> <tspan class="fn">attribute</tspan><tspan class="op">(</tspan><tspan class="ty">String</tspan> path<tspan class="op">)</tspan></text>

<!-- labels -->
<text x="1110" y="312" class="cm" text-anchor="end">// value</text>
<text x="1110" y="368" class="cm" text-anchor="end">// function</text>
<text x="1110" y="424" class="cm" text-anchor="end">// type</text>
<text x="1110" y="480" class="cm" text-anchor="end">// attribute</text>

<!-- status bar -->
<rect y="583" width="1200" height="44" fill="#161b22"/><rect y="583" width="1200" height="1" fill="#21262d"/>
<text x="90" y="611" class="ui">// one raga. every rendition.</text>
<text x="1110" y="611" class="ui" text-anchor="end" style="fill:#e6edf3">raga-lang.github.io</text>
</svg>
